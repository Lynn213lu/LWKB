<!DOCTYPE html>

<head data-page-node-id="usofNOrnLeKNM5ra9FzpAc">
<script data-page-node-id="8NuV1E2Fg1bMv1Xlw2FqrC" src="/page/page_comm/inject.js"></script>

<title data-page-node-id="5d1hjcOmWVTXQ2OpuD2Zid" data-pnid-children="6nTtVA7Znl9dkLVr5asZvP">光影魔法乐园</title>
<style data-page-node-id="yYQxOEEqEzEWrK220w342I" data-pnid-children="GaAfC7gzloARFl3OwQ216j">
:root{
  --bg1:#FFF6E0; --bg2:#FFE1F0; --bg3:#DFF3FF;
  --ink:#3B3355; --sub:#8A82A6; --line:#EBE0F7;
  --pink:#FF5C8A; --orange:#FF8A3D; --yellow:#FFC61A; --green:#3FC97A;
  --cyan:#2FC5C0; --blue:#3E8BFF; --purple:#8A5CFF; --red:#FF4B57;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(1100px 560px at 10% -12%, rgba(255,246,190,.95) 0%, rgba(255,246,190,0) 62%),
    radial-gradient(900px 520px at 100% 0%, rgba(214,240,255,.9) 0%, rgba(214,240,255,0) 60%),
    linear-gradient(140deg,var(--bg1) 0%,var(--bg2) 48%,var(--bg3) 100%);
}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.scene{display:none;height:100%;min-height:0}
.scene.on{display:grid}

/* 通用 */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;flex-wrap:nowrap}
.brand{font-size:clamp(17px,2.4vh,24px);font-weight:700;letter-spacing:1px;
  background:linear-gradient(90deg,var(--pink),var(--orange),var(--green),var(--cyan),var(--blue),var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.btn{border:none;background:#fff;color:var(--ink);font-size:clamp(13px,1.7vh,16px);
  padding:9px 18px;border-radius:999px;cursor:pointer;font-family:inherit;
  box-shadow:0 3px 10px rgba(120,90,160,.14);white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn.p{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff}
.btn.o{background:linear-gradient(135deg,var(--orange),var(--yellow));color:#fff}
.btn.sm{padding:6px 13px;font-size:clamp(12px,1.5vh,14px)}
.card{background:rgba(255,255,255,.92);border-radius:22px;padding:14px 16px;
  box-shadow:0 8px 26px rgba(120,90,160,.13)}
.muted{color:var(--sub);font-size:clamp(12px,1.5vh,14px);line-height:1.6}
h1{font-size:clamp(20px,3.4vh,32px);margin:0 0 4px}
h2{font-size:clamp(15px,2.1vh,20px);margin:0 0 6px}
h3{font-size:clamp(13px,1.7vh,16px);margin:0 0 6px}

/* 注册 */
#sReg.on{grid-template-rows:1fr;place-items:center}
.reg{width:min(560px,92vw);text-align:center;padding:26px 26px}
.reg input{width:100%;font-size:clamp(16px,2.4vh,22px);padding:14px 18px;border-radius:16px;
  border:2px solid var(--line);outline:none;font-family:inherit;text-align:center;margin:14px 0 6px}
.reg input:focus{border-color:var(--purple)}
.msg{font-size:clamp(13px,1.6vh,15px);min-height:22px;margin:6px 0 12px}
.err{color:var(--red)}.ok{color:var(--green)}

/* 主页 */
#sHome.on{grid-template-rows:auto 1fr auto}
.badgeRow{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

/* 游戏 */
#sGame.on{grid-template-rows:auto 1fr auto}
.gameMain{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,330px);gap:14px;
  padding:0 18px;min-height:0}
.stageBox{background:rgba(255,255,255,.88);border-radius:24px;padding:8px;min-height:0;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(120,90,160,.13)}
.stageBox svg{width:100%;height:100%;max-height:100%}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.panel{background:rgba(255,255,255,.94);border-radius:20px;padding:12px 14px;
  box-shadow:0 6px 20px rgba(120,90,160,.12)}
.panel.know{background:linear-gradient(135deg,#FFF9E9,#F1F7FF);border:2px solid #FFE6B8}
.knowList{margin:6px 0 0;padding-left:18px;font-size:clamp(12px,1.55vh,15px);line-height:1.75}
.knowList li{margin:3px 0}
.knowKey{margin-top:8px;font-size:clamp(12px,1.6vh,15px);font-weight:700;color:#C97B1A;
  background:#FFF1D6;border-radius:12px;padding:7px 10px}
.ctrl{display:flex;flex-direction:column;gap:8px;overflow:auto}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 13px;
  font-size:clamp(12px,1.6vh,15px);cursor:pointer;text-align:left;font-family:inherit;width:100%}
.opt:hover{border-color:var(--blue)}
.opt.ok{border-color:var(--green);background:#E9FBEE}
.opt.no{border-color:var(--pink);background:#FFEEF3}
.foot{padding:6px 18px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stat{font-size:clamp(12px,1.6vh,15px);font-weight:700;color:#C97B1A}

/* 徽章馆 / 排行 */
#sBadge.on,#sRank.on{grid-template-rows:auto 1fr}
.sheet{padding:0 18px 14px;min-height:0;overflow:auto}
.bgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:10px}
.bitem{background:#fff;border-radius:18px;padding:8px;text-align:center;
  box-shadow:0 5px 16px rgba(120,90,160,.12)}
.zgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:clamp(12px,1.55vh,15px)}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:600}
tr.me td{background:#FFF3D6;font-weight:700}
.zone{border:2px dashed #DCCFE8;border-radius:18px;padding:10px;background:rgba(255,255,255,.7);min-height:96px}
.zone.over{border-color:var(--green);background:#E9FBEE}
.plant{background:#fff;border:2px solid var(--line);border-radius:14px;padding:7px 11px;
  font-size:clamp(12px,1.5vh,14px);cursor:grab;display:inline-block;margin:4px;touch-action:none}
.plant.ok{border-color:var(--green);background:#E9FBEE}
.pickList{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px;
  max-height:22vh;overflow:auto}
.pick{background:#fff;border-radius:14px;padding:8px 14px;cursor:pointer;
  box-shadow:0 3px 10px rgba(120,90,160,.12);font-size:clamp(12px,1.6vh,15px)}
.pick:hover{background:#F3ECFF}
.blkTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.mini{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:14px;cursor:pointer;
  background:#FBF6FF;margin-bottom:6px}
.mini:hover{background:#F1E8FF}
.mini .q{font-size:clamp(11px,1.45vh,14px);font-weight:600;line-height:1.4}
#sWiki.on,#sQuiz.on{grid-template-rows:auto 1fr}
.wikiMain{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px;
  padding:0 18px 14px;min-height:0}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tab{border:none;background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;
  font-family:inherit;font-size:clamp(11px,1.45vh,14px);box-shadow:0 2px 8px rgba(120,90,160,.1)}
.tab.on{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff}
.wlist{max-height:100%;overflow:auto;padding-right:4px}
.witem{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:6px 8px;
  margin-bottom:6px;cursor:pointer;box-shadow:0 2px 8px rgba(120,90,160,.08)}
.witem:hover{background:#F6F0FF}
.witem .nm{font-size:clamp(12px,1.5vh,15px);font-weight:600}
.witem .fm{font-size:11px;color:var(--sub)}
.wdet{background:rgba(255,255,255,.95);border-radius:22px;padding:16px 18px;min-height:0;overflow:auto;
  box-shadow:0 8px 26px rgba(120,90,160,.13)}
.wdet .big{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.wdet h2{font-size:clamp(17px,2.6vh,26px)}
.tag{display:inline-block;background:#F3ECFF;color:#6C4FB8;border-radius:999px;
  padding:3px 10px;font-size:11px;margin:2px 4px 2px 0}
.qbox{background:rgba(255,255,255,.95);border-radius:22px;padding:16px 18px;max-width:820px;
  margin:0 auto;box-shadow:0 8px 26px rgba(120,90,160,.13);
  max-height:100%;overflow:auto}
.qtitle{font-size:clamp(15px,2.3vh,22px);font-weight:700;line-height:1.5;margin-bottom:10px}
.qopt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;
  border-radius:14px;padding:11px 15px;margin-bottom:8px;cursor:pointer;font-family:inherit;
  font-size:clamp(13px,1.7vh,16px)}
.qopt:hover{border-color:var(--blue)}
.qopt.ok{border-color:var(--green);background:#E9FBEE}
.qopt.no{border-color:var(--pink);background:#FFEEF3}
.qmeta{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qcat{color:#fff;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;
  box-shadow:0 2px 6px rgba(120,90,160,.18)}
.qpic{display:flex;justify-content:center;margin:2px 0 8px}
.qpic svg{filter:drop-shadow(0 4px 8px rgba(120,90,160,.18))}
.qscore{font-size:clamp(34px,7vh,60px);font-weight:800;color:var(--purple);line-height:1.1}
.qscore span{font-size:0.42em;color:#9A8FB5;font-weight:700}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.qchips .qcat{font-size:11px;padding:2px 10px}
.stars3{font-size:clamp(30px,6vh,52px);letter-spacing:6px;line-height:1.2}
.stars3 span{color:#E3DAF0}
.stars3 span.on{color:#FFC93D;text-shadow:0 3px 8px rgba(255,190,60,.45)}
.gbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.gpill{background:#F3ECFF;color:#6C4FB8;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700}
.gpill.warn{background:#FFEAF0;color:#D9436A}
.bTask{display:flex;align-items:center;gap:10px;background:#FFF8E8;border:2px solid #FFD98A;
  border-radius:16px;padding:8px 12px;margin-bottom:8px}
.bTask .bt{font-size:clamp(13px,2vh,18px);font-weight:700}
.bst{color:#FFB43D;letter-spacing:1px}

/* 乐园地图主页 */
.homeMain{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:14px;
  padding:0 18px 10px;min-height:0}
.sideCol{display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;min-height:0}
.mapCard{padding:10px;min-height:0;overflow:hidden}
#parkMap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#parkMap svg{width:100%;height:100%}
#parkMap .mk{cursor:pointer;transition:transform .2s;transform-box:fill-box;transform-origin:center bottom}
#parkMap .mk:hover{transform:translateY(-7px)}
#parkMap .cmp{transform-box:fill-box;transform-origin:center bottom;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.meTop{display:flex;gap:10px;align-items:center}
.meTop .av{line-height:0;flex:none}
.meTop .hi{font-size:clamp(14px,2vh,19px);font-weight:800;word-break:break-all}
.st2{display:flex;align-items:baseline;gap:5px;margin:2px 0}
.st2 .big{font-size:clamp(24px,3.6vh,34px);font-weight:800;color:var(--purple);line-height:1.05}
.st2 .u{font-size:12px;color:var(--sub)}
.pbar{height:10px;background:#F1EBF8;border-radius:999px;overflow:hidden;margin:10px 0 6px}
.pbar div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink))}
.lvGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv2{background:#fff;border:none;border-radius:18px;padding:9px 5px 8px;cursor:pointer;
  font-family:inherit;box-shadow:0 5px 14px rgba(120,90,160,.12);
  display:flex;flex-direction:column;align-items:center;gap:2px}
.lv2:hover{transform:translateY(-3px)}
.lv2 .t{font-size:clamp(11px,1.5vh,14px);font-weight:700;text-align:center;line-height:1.25}
.lv2 .st{font-size:11px;color:#FFB43D;letter-spacing:1px}
.lv2 .st.no{color:#BDB3D4;letter-spacing:0;font-size:10px}
.pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50}
.pop.on{display:flex}
.popCard{background:#fff;border-radius:26px;padding:22px 26px;text-align:center;
  box-shadow:0 20px 50px rgba(90,60,130,.28);max-width:min(460px,90vw)}

/* ===== 花园首页 ===== */
#sHome.on{grid-template-rows:auto 1fr auto}
.gardenWrap{min-height:0;padding:0 14px;display:flex}
.gardenCard{flex:1;position:relative;background:rgba(255,255,255,.6);border-radius:26px;padding:6px;
  box-shadow:0 10px 30px rgba(120,90,160,.14);min-height:0;overflow:hidden}
#gardenMap{width:100%;height:100%}
#gardenMap svg{width:100%;height:100%;display:block}
#gardenMap .mk{cursor:pointer}
#gardenMap .mk:hover .lift{transform:translateY(-8px)}
#gardenMap .lift{transition:transform .25s;transform-box:fill-box;transform-origin:center bottom}
#gardenMap .sway{transform-box:fill-box;transform-origin:center bottom;animation:sway 3.2s ease-in-out infinite}
#gardenMap .sway2{animation-delay:.7s}#gardenMap .sway3{animation-delay:1.3s}#gardenMap .sway4{animation-delay:1.9s}
@keyframes sway{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
#gardenMap .fly1{animation:fly1 9s ease-in-out infinite}
#gardenMap .fly2{animation:fly2 12s ease-in-out infinite}
@keyframes fly1{0%,100%{transform:translate(0,0)}25%{transform:translate(60px,-26px)}55%{transform:translate(130px,10px)}80%{transform:translate(40px,26px)}}
@keyframes fly2{0%,100%{transform:translate(0,0)}30%{transform:translate(-80px,20px)}60%{transform:translate(-150px,-18px)}85%{transform:translate(-50px,-30px)}}
#gardenMap .cmp{transform-box:fill-box;transform-origin:center bottom;animation:bob 2.6s ease-in-out infinite}
#gardenMap .flagWave{transform-box:fill-box;transform-origin:left bottom;animation:flagW 1.6s ease-in-out infinite}
@keyframes flagW{0%,100%{transform:skewY(-4deg)}50%{transform:skewY(4deg)}}
/* 手机快捷按钮格 */
.quickGrid{display:none;padding:10px 14px 0;gap:8px;
  grid-template-columns:repeat(4,minmax(0,1fr))}
.qbtn{border:none;border-radius:18px;padding:11px 4px;cursor:pointer;font-family:inherit;color:#fff;
  font-size:clamp(12px,1.6vh,15px);font-weight:700;box-shadow:0 5px 14px rgba(120,90,160,.18);
  display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.2}
.qbtn:active{transform:scale(.96)}
.qbtn .qic{font-size:clamp(18px,2.6vh,24px)}
.qbtn.castle{grid-column:span 4;background:linear-gradient(135deg,#FF7EB0,#A78BFA)}
.quickGrid .qbtn:nth-child(1){background:#FF5A5F}.quickGrid .qbtn:nth-child(2){background:#FFA94D}
.quickGrid .qbtn:nth-child(3){background:#E8B70A}.quickGrid .qbtn:nth-child(4){background:#3FB877}
.quickGrid .qbtn:nth-child(5){background:#2FC5C0}.quickGrid .qbtn:nth-child(6){background:#3E8BFF}
.quickGrid .qbtn:nth-child(7){background:#8A5CFF}

/* 翻牌 / 点球 / 点灯 等新游戏 */
.memoGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;height:100%;
  align-content:center;padding:10px;max-width:640px;margin:0 auto}
.mcard{position:relative;border-radius:16px;cursor:pointer;perspective:600px;aspect-ratio:3/4;max-height:150px}
.mcard .inner{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.mcard.flip .inner{transform:rotateY(180deg)}
.mface{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;backface-visibility:hidden;font-weight:700;
  box-shadow:0 4px 12px rgba(120,90,160,.16)}
.mface.bk{background:linear-gradient(135deg,#B48BE8,#7A5CF0);color:#fff;font-size:clamp(20px,4vh,32px)}
.mface.ft{background:#fff;transform:rotateY(180deg);border:3px solid var(--line);
  font-size:clamp(12px,1.8vh,16px);text-align:center;padding:4px;overflow:hidden}
.mface.ft svg{height:52%;width:auto;max-width:72%;flex:none;min-height:0}
.mcard.done .inner{opacity:0;transform:rotateY(180deg) scale(.6);transition:all .5s;pointer-events:none}
.dotRow{display:flex;gap:3px;justify-content:center}
.dotRow i{width:12px;height:12px;border-radius:50%;display:inline-block}
.bigMsg{font-size:clamp(15px,2.2vh,20px);font-weight:800;color:#7A4BE8}

.lampGrid{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:6px}
.lamp{cursor:pointer}
.lamp circle.body{transition:fill .18s}
@keyframes orbIn{from{transform:scale(0)}70%{transform:scale(1.18)}to{transform:scale(1)}}
@keyframes orbOut{to{transform:scale(1.6);opacity:0}}
@keyframes happy{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-5deg)}70%{transform:scale(1.05) rotate(4deg)}100%{transform:scale(1)}}
@keyframes wilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes lampGlow{0%{filter:brightness(1)}50%{filter:brightness(1.7)}100%{filter:brightness(1)}}
@keyframes bubbleUp{0%{transform:translateY(0);opacity:0}25%{opacity:.9}100%{transform:translateY(-72px);opacity:0}}
.bb{animation:bubbleUp 2.2s ease-in infinite}

/* ===== 响应式 ===== */
@media (max-width:900px){
  html,body{overflow:auto}
  #app{height:auto;min-height:100dvh}
  .scene.on{display:flex;flex-direction:column;min-height:100dvh}
  #sHome.on{min-height:100dvh}
  .top{padding:8px 10px}
  /* 花园满宽无留白 */
  .gardenWrap{order:1;flex:none;padding:0}
  .gardenCard{aspect-ratio:900/560;border-radius:0;box-shadow:none;padding:0}
  .quickGrid{order:2;display:grid}
  .foot{order:3}
  .homeMain{display:none}
  /* 游戏页竖屏顺序：舞台 → 操作按钮 → 科学知识 */
  .gameMain{display:flex;flex-direction:column;padding:0 10px;overflow:visible}
  .stageBox{order:1;flex:none;height:44vh;min-height:230px;overflow:hidden}
  .side{display:contents}
  .panel.ctrl{order:2}
  .panel.know{order:3}
  .ctrl{overflow:visible}
  .wikiMain{display:flex;flex-direction:column;padding:0 10px 12px}
  .wikiMain .card{max-height:38vh}
  .wdet{overflow:visible}
  .bgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .zgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sheet{overflow:visible}
  /* 翻牌：4 列缩放，保证全部塞进舞台 */
  .memoGrid{grid-template-columns:repeat(4,1fr);gap:8px}
  .mcard{max-height:none}
  .mface.ft{font-size:clamp(11px,1.7vh,15px);gap:2px;justify-content:center;padding:2px}
  .qbox{padding:14px}
}
@media (max-width:600px){
  .top{flex-wrap:wrap;row-gap:6px}
  .top>div:first-child{flex-wrap:wrap}
  .brand{white-space:normal}
}
@media (max-width:480px){
  .quickGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .quickGrid .qbtn.castle{grid-column:span 3}
}
@media (pointer:coarse){
  .btn,.opt,.qopt,.tab{min-height:44px}
}
</style>

<!--pnid:5r7ZMMHtafrHN0xTU2B4x2--><!-- 注册 -->
<section data-page-node-id="e7DukoQFJP5Q8RpAbVFwwx" class="scene on" id="sReg">

/* 老版本进度迁移：只搬星星总数，关卡记录按新玩法重新开始 */
(function migrate(){
  try{
    const old=JSON.parse(localStorage.getItem(OLDK)||'{}');
    Object.keys(old).forEach(k=>{
      if(DB[k])return;
      DB[k]={stars:Math.max(0,old[k].stars|0),cleared:{},ts:old[k].ts||Date.now()};
    });
    if(!localStorage.getItem(MEK)&&localStorage.getItem('gy_me_v1')){
      const m=localStorage.getItem('gy_me_v1');
      if(DB[m])localStorage.setItem(MEK,m);

})();
const DEMO=[['小光子',42,{}],['追光猫',31,{}],['小树苗',18,{}]];
(function seedDemo(){

/* 进度码：把当前玩家的进度变成一串字符，可复制到别的设备找回进度 */
function encodeCode(n,d){try{return 'GY1-'+btoa(unescape(encodeURIComponent(JSON.stringify({n:n,d:d})))).replace(/=+$/,'')}catch(e){return ''}}
function decodeCode(s){try{
    let t=s.trim().replace(/^GY1-/,'');t+='==='.slice(0,(4-t.length%4)%4);
    const o=JSON.parse(decodeURIComponent(escape(atob(t))));
    return (o&&o.n&&o.d&&typeof o.d.stars==='number')?o:null;
  }catch(e){return null}}
function showCode(){
  if(!ME)return;
  const c=encodeCode(ME,DB[ME]);
  showPop(`<h2>「${ME}」的进度码</h2>

}

    .then(()=>{ta.blur();toast('复制好啦，去粘贴保存吧');})

  const o=decodeCode($('#codeIn').value||'');
  if(!o){$('#codeIn').value='';$('#codeIn').placeholder='这串码好像不对，再检查一下？';return;}
  DB[o.n]=o.d;saveDB(DB);localStorage.setItem(MEK,o.n);

}

  $('#oldList').innerHTML=keys.length?
    keys.sort((a,b)=>DB[b].stars-DB[a].stars).map(k=>
      `<div class="pick" onclick="pickPlayer('${String(k).replace(/['"\\\\]/g,'')}')">${k} · ${DB[k].stars} 星</div>`).join('')
    :'<div class="muted">还没有人创建过玩家，先在上面取个名字吧</div>';
}
function doReg(){
  const n=$('#nameIn').value.trim();
  if(!n){$('#regMsg').className='msg err';$('#regMsg').textContent='先写一个名字吧';return;}

  DB[n]={stars:0,cleared:{},ts:Date.now()};saveDB(DB);
  localStorage.setItem(MEK,n);REG_BACK=null;enter(n);
}
function enter(n){ME=n;DB=loadDB();if(!DB[n])return logout();renderHome();go('sHome');}

/* ---------- 美术生成 ---------- */
function badgeSVG(t,on,size){
  const x=TIERS[t-1],c=on?x.c:'#E6E0DA',c2=on?shade(x.c,30):'#F2EDE6';
  let pet='';
  for(let k=0;k<6;k++){
    pet+=`<ellipse cx="50" cy="29" rx="15" ry="21" fill="${k%2?c2:c}"
      transform="rotate(${k*60} 50 50)" stroke="#fff" stroke-width="2.5"/>`;
  }
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}">
   <g>${pet}</g>
   <circle cx="50" cy="50" r="20" fill="#fff"/>
   <circle cx="50" cy="50" r="15.5" fill="${on?c:'#EDE7E0'}"/>
   <text x="50" y="57" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">${on?t:''}</text>
  </svg>`;
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+amt)),
  g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function zodiacSVG(i,unlocked,size){
  const z=ZODIAC[i],c=unlocked?z.c:'#E6E0DA',eye=unlocked?'#3A3355':'#C3BCB4';
  let ears='';
  if(z.ear==='long')ears=`<ellipse cx="33" cy="24" rx="8" ry="19" fill="${c}" transform="rotate(-8 33 24)"/>
    <ellipse cx="67" cy="24" rx="8" ry="19" fill="${c}" transform="rotate(8 67 24)"/>
    <ellipse cx="33" cy="24" rx="3.5" ry="12" fill="#FFC2D1"/><ellipse cx="67" cy="24" rx="3.5" ry="12" fill="#FFC2D1"/>`;
  else if(z.ear==='round')ears=`<circle cx="30" cy="24" r="12" fill="${c}"/><circle cx="70" cy="24" r="12" fill="${c}"/>
    <circle cx="30" cy="24" r="6" fill="#FFC2D1"/><circle cx="70" cy="24" r="6" fill="#FFC2D1"/>`;
  else if(z.ear==='small')ears=`<circle cx="33" cy="26" r="8" fill="${c}"/><circle cx="67" cy="26" r="8" fill="${c}"/>`;
  else if(z.ear==='droop')ears=`<ellipse cx="26" cy="46" rx="10" ry="17" fill="${c}"/><ellipse cx="74" cy="46" rx="10" ry="17" fill="${c}"/>`;
  else if(z.ear==='side')ears=`<circle cx="22" cy="44" r="13" fill="${c}"/><circle cx="78" cy="44" r="13" fill="${c}"/>
    <circle cx="22" cy="44" r="6" fill="#FFC2D1"/><circle cx="78" cy="44" r="6" fill="#FFC2D1"/>`;
  let extra='';
  if(z.horn==='cow')extra=`<path d="M30 22 q-10 -12 -16 -4" stroke="#F0D9B5" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M70 22 q10 -12 16 -4" stroke="#F0D9B5" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(z.horn==='sheep')extra=`<path d="M32 20 q-12 -6 -14 6" stroke="#EFE0C4" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M68 20 q12 -6 14 6" stroke="#EFE0C4" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  if(z.horn==='dragon')extra=`<path d="M34 18 l-6 -14 l12 6" stroke="#F5C84A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M66 18 l6 -14 l-12 6" stroke="#F5C84A" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(z.comb)extra=`<path d="M40 14 q4 -10 10 -4 q4 -8 8 2" fill="#FF5A5F"/>`;
  if(z.stripe)extra+=`<path d="M28 34 l6 8 M72 34 l-6 8" stroke="#F08A3C" stroke-width="3" stroke-linecap="round"/>`;
  if(z.mane)extra+=`<path d="M30 30 q20 -14 40 0" stroke="#B9835A" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  const nose=z.nose==='big'?`<ellipse cx="50" cy="52" rx="9" ry="6" fill="#FF9FB4"/><circle cx="46.5" cy="52" r="2" fill="#E87A94"/><circle cx="53.5" cy="52" r="2" fill="#E87A94"/>`
    :`<circle cx="50" cy="52" r="3.4" fill="${eye}" opacity=".8"/>`;
  return `<svg viewBox="0 0 100 108" width="${size}" height="${size*1.08}">
   <defs><clipPath id="zb${i}${unlocked}"><ellipse cx="50" cy="76" rx="31" ry="27"/></clipPath></defs>
   <ellipse cx="50" cy="80" rx="26" ry="10" fill="rgba(120,90,160,.13)"/>
   ${ears}
   <ellipse cx="50" cy="76" rx="31" ry="27" fill="${c}"/>
   <g clip-path="url(#zb${i}${unlocked})">
     <rect x="19" y="66" width="62" height="38" fill="#fff"/>
     ${RAINBOW.map((k,j)=>`<rect x="19" y="${66+j*5.4}" width="62" height="5.4" fill="${k}" opacity="${unlocked?0.9:0.25}"/>`).join('')}
   </g>
   <ellipse cx="50" cy="76" rx="31" ry="27" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2"/>
   <circle cx="50" cy="44" r="27" fill="${c}"/>
   ${extra}
   <circle cx="39" cy="42" r="5.6" fill="#fff"/><circle cx="61" cy="42" r="5.6" fill="#fff"/>
   <circle cx="39.5" cy="42.5" r="3.2" fill="${eye}"/><circle cx="61.5" cy="42.5" r="3.2" fill="${eye}"/>
   <circle cx="38" cy="41" r="1.1" fill="#fff"/><circle cx="60" cy="41" r="1.1" fill="#fff"/>
   <circle cx="32" cy="50" r="4.6" fill="#FF9FB4" opacity=".7"/><circle cx="68" cy="50" r="4.6" fill="#FF9FB4" opacity=".7"/>
   ${nose}
   <path d="M44 58 q6 6 12 0" stroke="${eye}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
   ${unlocked?'':'<circle cx="50" cy="60" r="13" fill="rgba(255,255,255,.85)"/><text x="50" y="65" text-anchor="middle" font-size="14">?</text>'}
  </svg>`;
}

function flowerSVG(o,size){
  const s=size,cx=s/2,cy=s/2,c=o.c,c2=shade(c,30);let g='';
  if(o.sh==='spike'){
    g+=`<line x1="${cx}" y1="${s*0.96}" x2="${cx}" y2="${s*0.16}" stroke="#6FAE5C" stroke-width="${s*0.05}" stroke-linecap="round"/>`;
    for(let i=0;i<6;i++){const y=s*0.20+i*s*0.115;
      g+=`<ellipse cx="${cx-s*0.085}" cy="${y}" rx="${s*0.075}" ry="${s*0.055}" fill="${i%2?c2:c}"/>`;
      g+=`<ellipse cx="${cx+s*0.085}" cy="${y+s*0.035}" rx="${s*0.075}" ry="${s*0.055}" fill="${i%2?c:c2}"/>`;}
  }else if(o.sh==='cluster'){
    for(let i=0;i<12;i++){const a=i*Math.PI*2/12,r=s*(i%2?0.15:0.26);
      g+=`<circle cx="${cx+r*Math.cos(a)}" cy="${cy-4+r*Math.sin(a)}" r="${s*0.075}" fill="${i%2?c:c2}"/>`;}
    g+=`<circle cx="${cx}" cy="${cy-4}" r="${s*0.07}" fill="${shade(c,-25)}"/>`;
  }else{
    const L=o.sh==='double'?2:1;
    for(let k=0;k<L;k++){
      const cnt=k?Math.round(o.p*0.6):o.p,rr=s*(k?0.15:0.235),pr=s*(k?0.07:0.10);
      for(let i=0;i<cnt;i++){const a=i*360/cnt+k*17;
        g+=`<ellipse cx="${cx}" cy="${cy-rr}" rx="${pr}" ry="${pr*1.95}" fill="${k?c2:c}" transform="rotate(${a} ${cx} ${cy})"/>`;}
    }
    g+=`<circle cx="${cx}" cy="${cy}" r="${s*(o.sh==='double'?0.11:0.13)}" fill="#FFF3C4"/>`;
    g+=`<circle cx="${cx}" cy="${cy}" r="${s*0.05}" fill="${shade(c,-30)}"/>`;
  }
  return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}">${g}</svg>`;
}
function treeSVG(o,size){
  const s=size,cx=s/2,c=o.c,c2=shade(c,-24);let cr='';
  if(o.cr==='cone'){
    cr=`<path d="M${cx} ${s*0.12} L${s*0.83} ${s*0.74} L${s*0.17} ${s*0.74} Z" fill="${c}"/>
      <path d="M${cx} ${s*0.30} L${s*0.74} ${s*0.88} L${s*0.26} ${s*0.88} Z" fill="${c2}"/>`;
  }else if(o.cr==='palm'){
    for(let i=0;i<7;i++){const a=(-155+i*31)*Math.PI/180;
      cr+=`<path d="M${cx} ${s*0.36} q${Math.cos(a)*s*0.34} ${Math.sin(a)*s*0.34-s*0.06} ${Math.cos(a)*s*0.60} ${Math.sin(a)*s*0.40}" stroke="${i%2?c:c2}" stroke-width="${s*0.075}" fill="none" stroke-linecap="round"/>`;}
  }else if(o.cr==='weeping'){
    cr=`<ellipse cx="${cx}" cy="${s*0.34}" rx="${s*0.34}" ry="${s*0.21}" fill="${c}"/>`;
    for(let i=0;i<6;i++){const x=s*0.22+i*s*0.112;
      cr+=`<path d="M${x} ${s*0.43} q${s*0.035} ${s*0.22} ${-s*0.012} ${s*0.40}" stroke="${c2}" stroke-width="${s*0.03}" fill="none" stroke-linecap="round"/>`;}
  }else if(o.cr==='umbrella'){
    cr=`<ellipse cx="${cx}" cy="${s*0.34}" rx="${s*0.42}" ry="${s*0.25}" fill="${c}"/>
      <ellipse cx="${cx-s*0.18}" cy="${s*0.28}" rx="${s*0.16}" ry="${s*0.12}" fill="${c2}" opacity=".5"/>
      <ellipse cx="${cx+s*0.17}" cy="${s*0.30}" rx="${s*0.14}" ry="${s*0.10}" fill="${c2}" opacity=".4"/>`;
  }else{
    cr=`<circle cx="${cx}" cy="${s*0.35}" r="${s*0.30}" fill="${c}"/>
      <circle cx="${cx-s*0.16}" cy="${s*0.29}" r="${s*0.15}" fill="${c2}" opacity=".45"/>
      <circle cx="${cx+s*0.14}" cy="${s*0.31}" r="${s*0.13}" fill="${c2}" opacity=".35"/>`;
  }
  const trunk=`<rect x="${cx-s*0.055}" y="${s*0.50}" width="${s*0.11}" height="${s*0.36}" rx="${s*0.03}" fill="#A9764C"/>`;
  const grass=`<ellipse cx="${cx}" cy="${s*0.90}" rx="${s*0.36}" ry="${s*0.06}" fill="#BFEBC0"/>`;
  return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}">${grass}${trunk}${cr}</svg>`;
}

/* ---------- 通用：三星评价与结算 ---------- */
let GT0=0,GERR=0,GDONE=false,GTIMER=null,HU=0;
function gBegin(){GT0=Date.now();GERR=0;GDONE=false;HU=0;if(GTIMER){clearInterval(GTIMER);GTIMER=null;}}
function gSec(){return Math.max(1,Math.round((Date.now()-GT0)/1000));}
function finishLevel(n,tip,stat){
  if(GDONE)return;GDONE=true;
  if(GTIMER){clearInterval(GTIMER);GTIMER=null;}
  let s=Math.max(1,Math.min(3,n|0));
  if(HU)s=Math.max(1,s-1);
  const p=DB[ME];
  p.best=p.best||{};if(s>(p.best[CUR]||0))p.best[CUR]=s;
  p.cleared[CUR]=(p.cleared[CUR]||0)+1;saveDB(DB);
  const get=s;
  addRawStar(get);
  const K=KNOW[CUR-1],L=LEVELS[CUR-1];
  const statLine=stat||('失误 '+GERR+' 次'+(HU?'　·　用了提示 -1 星':''));
  showPop(`<h2>${L.t} 通关！</h2>
    <div class="stars3">${[0,1,2].map(i=>`<span class="${i<s?'on':''}">★</span>`).join('')}</div>
    <div class="muted">用时 ${gSec()} 秒　·　${statLine}</div>
    <div class="muted">拿到 <b>${get}</b> 颗星星（每次通关都是这个奖励，随时可以再来玩）</div>
    <p style="font-size:clamp(13px,1.9vh,16px);line-height:1.8;margin-top:8px">${tip}</p>
    <div class="knowKey">${K.k}</div>
    <div class="row" style="margin-top:12px">
      <button class="btn p" onclick="closePop();start(CUR)">再玩一次</button>
      <button class="btn" onclick="closePop();go('sHome')">回花园</button></div>`);
}
function svgPoint(svg,e){const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
  return{x:(e.clientX-r.left)/r.width*vb.width,y:(e.clientY-r.top)/r.height*vb.height};}

/* 第 1 关：影子捉迷藏（5 题，难度递进） */
function lv1(){
  gBegin();
  const qs=[
   {t:8.5,q:'影子歪向了右边，太阳在哪一边？',o:['东边（早上）','头顶正上方（中午）','西边（下午）'],a:0},
   {t:12,q:'影子又小又圆，缩在脚底下，太阳在哪？',o:['东边（早上）','头顶正上方（中午）','西边（下午）'],a:1},
   {t:16.5,q:'影子歪向了左边，太阳在哪一边？',o:['东边（早上）','头顶正上方（中午）','西边（下午）'],a:2},
   {t:18,q:'影子拉得又长又斜，说明太阳很低很低。大约几点？',o:['早上 6 点','中午 12 点','傍晚 6 点'],a:2},
   {t:6.8,q:'影子也很长，但歪的方向和上一题正好相反。大约几点？',o:['早上 7 点','中午 12 点','傍晚 6 点'],a:0}];
  let idx=0,bad=0;
  $('#stage').innerHTML=`<svg id="s1" viewBox="0 0 700 400">
   <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0" stop-color="#BFE3FF"/><stop offset="1" stop-color="#FFF3D9"/></linearGradient>
     <radialGradient id="sg"><stop offset="0" stop-color="#FFF0A8"/><stop offset="1" stop-color="#FFA94D"/></radialGradient></defs>
   <rect x="0" y="0" width="700" height="290" fill="url(#sky)"/>
   <rect x="0" y="290" width="700" height="110" fill="#BFEBC0"/>
   <ellipse cx="350" cy="292" rx="300" ry="14" fill="#A8DEAA"/>
   <circle id="sun" cx="100" cy="90" r="30" fill="url(#sg)"/>
   <circle id="sun2" cx="100" cy="90" r="30" fill="none" stroke="#FFD93D" stroke-width="6" opacity=".5"/>
   <g><rect x="336" y="228" width="28" height="66" rx="8" fill="#C99A63"/>
     <circle cx="350" cy="196" r="58" fill="#7BD389"/><circle cx="306" cy="214" r="36" fill="#8FDD9A"/>
     <circle cx="394" cy="214" r="36" fill="#8FDD9A"/><circle cx="350" cy="170" r="34" fill="#9BE3A8"/>
     <circle cx="330" cy="188" r="6" fill="#3A3355"/><circle cx="370" cy="188" r="6" fill="#3A3355"/>
     <path d="M338 204 q12 12 24 0" stroke="#3A3355" stroke-width="3" fill="none" stroke-linecap="round"/></g>
   <g id="shadow" opacity=".22">
     <rect x="336" y="228" width="28" height="66" rx="8" fill="#3A3355"/>
     <circle cx="350" cy="196" r="58" fill="#3A3355"/><circle cx="306" cy="214" r="36" fill="#3A3355"/>
     <circle cx="394" cy="214" r="36" fill="#3A3355"/><circle cx="350" cy="170" r="34" fill="#3A3355"/></g>
  </svg>`;
  $('#ctrl').innerHTML=`<div class="gbar"><span class="gpill" id="p1pg">第 1 / 5 题</span>
      <span class="gpill warn" id="p1er">失误 0 次</span></div>
    <h3 id="qtext" style="font-size:clamp(17px,2.6vh,24px)">看影子，猜太阳在哪</h3><div id="opts" style="display:grid;gap:8px"></div>
    <div style="margin-top:8px"><button class="btn p sm" id="playDay">▶ 看一天变化</button>
    <div class="muted" id="tval">点一下，太阳会自己从早走到晚</div></div>`;
  function draw(t){
    const a=Math.PI*(t-6)/12,s=Math.sin(a);
    const x=60+(t-6)/12*560,y=250-190*s;
    $('#sun').setAttribute('cx',x);$('#sun').setAttribute('cy',y);
    $('#sun2').setAttribute('cx',x);$('#sun2').setAttribute('cy',y);
    const k=0.25+1.35*(1-s),dir=(350-x)>0?1:-1,deg=dir*32*(1-s);
    $('#shadow').setAttribute('transform',`translate(350,294) rotate(${deg}) scale(1,${k}) translate(-350,-294)`);
    $('#tval').textContent='现在是 '+String(Math.floor(t)).padStart(2,'0')+':'+String(Math.round((t%1)*60)).padStart(2,'0');
  }
  let dayT=12,playing=false,dayRaf=null;
  function dayLoop(ts){
    if(!playing)return;
    dayT+=0.045;if(dayT>18)dayT=6;
    draw(dayT);dayRaf=requestAnimationFrame(dayLoop);
  }
  $('#playDay').onclick=function(){
    if(!playing){playing=true;dayT=6.2;this.textContent='⏸ 停一停';dayRaf=requestAnimationFrame(dayLoop);}
    else{playing=false;cancelAnimationFrame(dayRaf);this.textContent='▶ 再看一遍';}
  };
  function upd(){
    $('#p1pg').textContent='第 '+Math.min(idx+1,5)+' / 5 题';
    $('#p1er').textContent='失误 '+GERR+' 次';
  }
  function ask(){
    if(idx>=qs.length){
      let st=3-GERR;if(gSec()>120)st--;
      finishLevel(Math.max(1,st),'影子一会长一会短、一会左一会右，都是因为太阳一直在天空里走。掌握这条规律，你就能用影子估时间啦。');
      return;}
    const q=qs[idx];bad=0;upd();
    $('#qtext').textContent=q.q;
    playing=false;if(dayRaf)cancelAnimationFrame(dayRaf);
    $('#playDay').textContent='▶ 看一天变化';
    draw(q.t);
    $('#opts').innerHTML=q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('');
    $$('#opts .opt').forEach(b=>b.onclick=()=>{
      if(+b.dataset.i===q.a){b.classList.add('ok');idx++;upd();setTimeout(ask,600);}
      else{b.classList.add('no');b.textContent+='　再看看影子的方向和长短';
        if(!bad){bad=1;GERR++;}upd();}});
  }
  ask();
  HINTFN=()=>{$('#gMsg').textContent='太阳低→影子长，太阳高→影子短；影子永远歪向太阳的反方向。用提示会少一颗星哦。';};
}

/* 第 2 关：彩虹记忆翻牌（同色配对，纯点击） */
function lv2(){
  gBegin();
  const FACES=[
   {n:'红光',c:'#FF5A5F'},{n:'橙光',c:'#FFA94D'},{n:'黄光',c:'#FFD93D'},
   {n:'绿光',c:'#7BD389'},{n:'蓝光',c:'#5B9DF9'},{n:'紫光',c:'#A78BFA'}];
  let cards,open=[],lock=0,found=0;
  $('#stage').innerHTML='<div class="memoGrid" id="memoG"></div>';
  $('#ctrl').innerHTML=`<div class="gbar"><span class="gpill" id="p2pg">配对 0 / 6</span>
      <span class="gpill warn" id="p2mv">步数 0</span></div>
    <h3>翻牌找朋友</h3>
    <div class="muted">每张牌后面藏着一颗彩色光球。点开两张，<b>颜色一样</b>的就是好朋友！每翻两张算一步，<b>步数越少星星越多</b>：12 步内 ★★★，19 步内 ★★☆。</div>
    <div class="muted bigMsg" id="s2msg"></div>`;
  const deck=[];
  FACES.forEach(f=>{deck.push({n:f.n,c:f.c});deck.push({n:f.n,c:f.c});});
  cards=shuffle(deck);
  $('#memoG').innerHTML=cards.map((c,i)=>{
    const tc=(c.c==='#FFD93D')?'#C98A0A':c.c;
    let rays='';
    for(let k=0;k<8;k++){const a=k*45*Math.PI/180;
      rays+=`<line x1="${50+30*Math.cos(a)}" y1="${50+30*Math.sin(a)}" x2="${50+38*Math.cos(a)}" y2="${50+38*Math.sin(a)}" stroke="${c.c}" stroke-width="5" stroke-linecap="round"/>`;}
    return `<div class="mcard" data-i="${i}"><div class="inner">
      <div class="mface bk">✦</div>
      <div class="mface ft" style="background:${c.c}1F;border-color:${c.c}">
        <svg viewBox="0 0 100 100">${rays}
          <circle cx="50" cy="50" r="24" fill="${c.c}"/>
          <circle cx="43" cy="46" r="3" fill="#fff"/><circle cx="57" cy="46" r="3" fill="#fff"/>
          <path d="M42 56 q8 8 16 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
        <div style="color:${tc};font-size:clamp(13px,2vh,17px);font-weight:800">${c.n}</div>
      </div>
    </div></div>`;}).join('');
  const starsFor=m=>m<=12?3:(m<=19?2:1);
  let moves=0;
  $$('#memoG .mcard').forEach(el=>{
    el.onclick=()=>{
      if(lock||el.classList.contains('flip')||el.classList.contains('done'))return;
      const c=cards[+el.dataset.i];
      el.classList.add('flip');open.push({el:el,c:c});
      if(open.length===2){
        lock=1;moves++;
        $('#p2mv').textContent='步数 '+moves;
        const A=open[0],B=open[1];
        if(A.c.n===B.c.n){
          found++;
          $('#p2pg').textContent='配对 '+found+' / 6';
          $('#s2msg').textContent='一对好朋友：'+A.c.n+' 和 '+B.c.n;
          setTimeout(()=>{
            A.el.classList.add('done');B.el.classList.add('done');
            open=[];lock=0;
            if(found===FACES.length){
              const st=Math.max(1,starsFor(moves)-(HU?1:0));
              finishLevel(st,'红、橙、黄、绿、蓝、紫，彩虹里的每一种颜色都是一束光。两束光混在一起，还会变出新颜色呢！',
                '翻了 '+moves+' 步（两张算一步）'+(HU?'　·　用了提示 -1 星':(moves<=12?'　·　记忆小达人！':'')));
            }
          },480);
        }else{
          $('#s2msg').textContent='颜色不一样，记住它们在哪里～';
          setTimeout(()=>{A.el.classList.remove('flip');B.el.classList.remove('flip');open=[];lock=0;},820);
        }
      }
    };
  });
  HINTFN=()=>{$('#gMsg').textContent='先点开一张，记住它的颜色，再去翻一样颜色那张。用提示会少一颗星哦。';};
}

/* 第 3 关：追光小能手（限时点中目标颜色的光球，纯点击） */
function lv3(){
  gBegin();
  let target=0,hits=0,orbs={},spawnT=null,over=false;
  const R=34,NM=['红','橙','黄','绿','青','蓝','紫'];
  const SLOTS=[];
  for(let r=0;r<2;r++)for(let c=0;c<4;c++)SLOTS.push({x:110+c*160,y:140+r*140});
  $('#stage').innerHTML=`<svg id="s3" viewBox="0 0 700 420">
   <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
     <stop offset="0" stop-color="#FFF6E5"/><stop offset="1" stop-color="#EFEAFF"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
   </defs>
   <rect width="700" height="420" fill="url(#g3)"/>
   <ellipse cx="90" cy="56" rx="64" ry="36" fill="#fff" opacity=".55"/>
   <ellipse cx="620" cy="84" rx="74" ry="40" fill="#fff" opacity=".45"/>
   <g id="pots"></g>
   <g id="orbs"></g>
  </svg>`;
  $('#ctrl').innerHTML=`<div class="gbar"><span class="gpill" id="p3pg">点中 0 / 8</span>
      <span class="gpill warn" id="p3er">失误 0 次</span></div>
    <div class="bTask" style="align-items:center;gap:12px"><span id="p3dot" style="width:46px;height:46px;border-radius:50%;display:inline-block;background:#ddd;flex:none"></span>
      <span class="bt" id="p3t" style="font-size:clamp(19px,3.2vh,28px)"></span></div>
    <div class="muted">花盆里会咕嘟咕嘟冒出七彩光球，只点任务牌上那个颜色的！</div>
    <div class="muted bigMsg" id="s3msg"></div>`;
  $('#pots').innerHTML=SLOTS.map(s=>`
    <g><ellipse cx="${s.x}" cy="${s.y+70}" rx="52" ry="10" fill="#4E3F70" opacity=".12"/>
    <path d="M${s.x-34} ${s.y+34} L${s.x+34} ${s.y+34} L${s.x+24} ${s.y+68} L${s.x-24} ${s.y+68} Z" fill="#C98A55"/>
    <rect x="${s.x-40}" y="${s.y+26}" width="80" height="14" rx="7" fill="#E0A26B"/></g>`).join('');
  function newTarget(){
    target=Math.floor(Math.random()*7);
    $('#p3dot').style.background=RAINBOW[target];
    $('#p3dot').style.boxShadow='0 0 18px '+RAINBOW[target];
    $('#p3t').textContent='点中【'+NM[target]+'色】的光球';
  }
  function spawn(){
    if(over)return;
    const free=SLOTS.map((s,i)=>i).filter(i=>!orbs[i]);
    if(!free.length)return;
    const i=free[Math.floor(Math.random()*free.length)];
    const ci=Math.floor(Math.random()*7);
    const s=SLOTS[i],g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('data-ci',ci);g.style.cursor='pointer';
    g.innerHTML=`<circle cx="${s.x}" cy="${s.y}" r="54" fill="url(#halo)"/>
      <circle class="body" cx="${s.x}" cy="${s.y}" r="${R}" fill="${RAINBOW[ci]}" stroke="#fff" stroke-width="4"/>
      <circle cx="${s.x-9}" cy="${s.y-9}" r="8" fill="#fff" opacity=".55"/>`;
    g.style.transformBox='fill-box';g.style.transformOrigin='center';
    g.style.animation='orbIn .3s ease-out';
    g.addEventListener('click',()=>hit(i,ci,g));
    $('#orbs').appendChild(g);
    orbs[i]=1;
    setTimeout(()=>{if(orbs[i]){g.remove();delete orbs[i];}},1700);
  }
  function hit(i,ci,g){
    if(over||!orbs[i])return;
    if(ci===target){
      hits++;$('#p3pg').textContent='点中 '+hits+' / 8';
      $('#s3msg').textContent='太准啦！'+NM[target]+'光到手';
      g.style.animation='orbOut .28s ease-in forwards';
      delete orbs[i];setTimeout(()=>g.remove(),280);
      if(hits>=8){
        over=true;clearInterval(spawnT);
        setTimeout(()=>{let st=3-GERR;if(gSec()>90)st--;
          finishLevel(Math.max(1,st),'白光里藏着七种颜色，棱镜能把它们分开。雨后的小水珠就是天然的棱镜，所以彩虹总在雨后出现。');},420);
      }else if(hits%3===0){newTarget();$('#s3msg').textContent='任务换颜色啦，看清楚！';}
    }else{
      GERR++;$('#p3er').textContent='失误 '+GERR+' 次';
      $('#s3msg').textContent='哎呀，这是'+NM[ci]+'光，不是'+NM[target]+'光';
      g.style.animation='orbOut .25s ease-in forwards';
      delete orbs[i];setTimeout(()=>g.remove(),250);
    }
  }
  newTarget();
  spawnT=setInterval(spawn,650);spawn();
  HINTFN=()=>{$('#gMsg').textContent='先看清任务牌的颜色再出手，光球会停留一小会儿，不着急。用提示会少一颗星哦。';};
}

/* 第 4 关：叶子大转盘（5 个任务，按停圆盘） */
function lv4(){
  gBegin();
  const C=[{n:'红光',c:'#FF5A5F',f:'吃'},{n:'橙光',c:'#FFA94D',f:'吃'},
   {n:'黄光',c:'#FFD93D',f:'推'},{n:'绿光',c:'#7BD389',f:'推'},
   {n:'青光',c:'#4ECDC4',f:'推'},{n:'蓝光',c:'#5B9DF9',f:'吃'},{n:'紫光',c:'#A78BFA',f:'吃'}];
  const TASKS=[
   {t:'转到【绿光】',ok:function(i){return i===3;},tip:'绿光被叶子推回来，所以我们看到叶子是绿的。'},
   {t:'转到叶子会【吃掉】的光',ok:function(i){return C[i].f==='吃';},tip:'红光、橙光、蓝紫光都被叶绿素吃掉，拿去做养分。'},
   {t:'转到【红光】',ok:function(i){return i===0;},tip:'红光是叶绿素最爱吃的光之一。'},
   {t:'转到叶子会【推回来】的光',ok:function(i){return C[i].f==='推';},tip:'黄、绿、青被推回来，混在一起就是我们眼睛收到的颜色。'},
   {t:'转到【蓝光】',ok:function(i){return i===5;},tip:'蓝光也被吃掉啦，叶子要拿它来做饭。'}];
  let ti=0,rot=0,run=false,raf=null,last=0,lock=0,missed=0;
  const seg=360/7,SPEED=118;
  $('#stage').innerHTML=`<svg id="s4" viewBox="0 0 420 420">
   <defs><filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7A5AA8" flood-opacity=".25"/></filter></defs>
   <circle cx="210" cy="210" r="196" fill="#fff" filter="url(#sh)"/>
   <g id="wheel"></g>
   <circle cx="210" cy="210" r="30" fill="#fff" stroke="#EFE6F8" stroke-width="4"/>
   <circle cx="210" cy="210" r="9" fill="#FFA94D"/>
   <path d="M210 52 l16 -30 l-32 0 z" fill="#3A3355"/>
  </svg>`;
  $('#ctrl').innerHTML=`<div class="gbar"><span class="gpill" id="p4pg">第 1 / 5 个任务</span>
      <span class="gpill warn" id="p4er">失误 0 次</span></div>
    <div class="bTask"><span class="bt" id="p4t" style="font-size:clamp(19px,3.2vh,28px)">任务</span></div>
    <button class="btn p" id="spin">转起来</button>
    <div id="res" class="muted">按下「转起来」，看准了再按「停！」</div>`;
  const R=172;
  $('#wheel').innerHTML=C.map((o,i)=>{
    const a0=-90+i*seg,a1=-90+(i+1)*seg;
    const P=a=>[210+R*Math.cos(a*Math.PI/180),210+R*Math.sin(a*Math.PI/180)];
    const A=P(a0),B=P(a1);
    return `<path d="M210 210 L${A[0]} ${A[1]} A${R} ${R} 0 0 1 ${B[0]} ${B[1]} Z" fill="${o.c}" stroke="#fff" stroke-width="4"/>`;
  }).join('')+C.map((o,i)=>{const a=(-90+(i+0.5)*seg)*Math.PI/180;
    return `<text x="${210+118*Math.cos(a)}" y="${210+118*Math.sin(a)+8}" text-anchor="middle"
      font-size="22" font-weight="700" fill="#fff">${o.n}</text>`;}).join('');
  const w=$('#wheel');
  w.style.transformBox='view-box';w.style.transformOrigin='210px 210px';w.style.transition='none';
  function upd(){
    $('#p4pg').textContent='第 '+Math.min(ti+1,5)+' / 5 个任务';
    $('#p4er').textContent='失误 '+GERR+' 次';
    $('#p4t').textContent=ti<5?TASKS[ti].t:'全部完成！';
  }
  function landed(){const a=((-rot)%360+360)%360;return Math.min(6,Math.floor(a/seg));}
  function loop(ts){if(!run)return;if(!last)last=ts;
    rot+=(ts-last)/1000*SPEED;last=ts;
    w.style.transform='rotate('+rot+'deg)';raf=requestAnimationFrame(loop);}
  $('#spin').onclick=function(){
    if(lock)return;
    if(!run){run=true;last=0;$('#spin').textContent='停！';$('#spin').className='btn o';
      $('#res').textContent='转动中……看准了就按停！';raf=requestAnimationFrame(loop);return;}
    run=false;cancelAnimationFrame(raf);last=0;
    $('#spin').textContent='转起来';$('#spin').className='btn p';
    const i=landed(),o=C[i];
    if(TASKS[ti].ok(i)){
      lock=1;
      $('#res').innerHTML=`<b style="color:${o.c}">${o.n}</b>　任务完成！${TASKS[ti].tip}`;
      setTimeout(function(){
        ti++;

/* ---------- 问答 ---------- */
let QSET=[],QI=0,QR=0;
const QCAT={light:{n:'光影',c:'#FFB43D'},plant:{n:'植物',c:'#6FBF5F'},mix:{n:'生活',c:'#7C9CF5'}};
const QCATS=['light','plant','mix'];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* 抽题：三类各出几道；没答过的优先；答错的会再考一次；答过的先不出现 */
function pickQuiz(n){
  const p=DB[ME];
  p.quizSeen=p.quizSeen||[];p.quizWrong=p.quizWrong||[];
  const seen={},wrong={};
  p.quizSeen.forEach(k=>seen[k]=1);p.quizWrong.forEach(k=>wrong[k]=1);
  const per=Math.max(1,Math.round(n/QCATS.length));
  const rPer=Math.max(1,Math.floor(per/3));     // 每一类最多"回收"几道答错过的题
  let out=[],reset=false;
  QCATS.forEach(c=>{
    let fresh=QUIZ.filter(q=>q.cat===c&&!seen[q.q]);
    if(!fresh.length){                      // 这一类都答过了 → 清空该类已答记录，重新轮一轮
      p.quizSeen=p.quizSeen.filter(k=>!(QUIZ.find(x=>x.q===k&&x.cat===c)));
      reset=true;fresh=QUIZ.filter(q=>q.cat===c);
    }
    const retry=shuffle(QUIZ.filter(q=>q.cat===c&&wrong[q.q])).slice(0,rPer);
    const add=shuffle(fresh.filter(q=>!wrong[q.q])).slice(0,per-retry.length);
    out=out.concat(retry,add);
  });
  if(reset)saveDB(DB);
  return shuffle(out).slice(0,n);
}
function startQuiz(){
  QSET=pickQuiz(9);QI=0;QR=0;
  go('sQuiz');quizShow();
}
function quizShow(){
  const p=DB[ME];
  $('#quizStat').textContent='星星 '+p.stars;

    $('#quizBox2').innerHTML=`<h2>答完啦</h2>

    renderHome();return;
  }
  const q=QSET[QI];
  const opts=shuffle(q.o.map((t,i)=>({t,i})));      // 选项乱序，正确答案不再总在同一个位置
  const ai=opts.findIndex(o=>o.i===q.a);

  $('#quizBox2').innerHTML=`<div class="qmeta">
      <span class="qcat" style="background:${QCAT[q.cat].c}">${QCAT[q.cat].n}</span>

    ${opts.map((x,i)=>`<button class="qopt" data-i="${i}">${x.t}</button>`).join('')}
    <div class="muted" id="qexp"></div>`;
  $$('#quizBox2 .qopt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p2=DB[ME];
    p2.quizSeen=p2.quizSeen||[];p2.quizWrong=p2.quizWrong||[];
    if(!p2.quizSeen.includes(q.q))p2.quizSeen.push(q.q);
    if(i===ai){
      b.classList.add('ok');QR++;addRawStar(1);
      p2.quizRight=(p2.quizRight||0)+1;

    }else{
      b.classList.add('no');$$('#quizBox2 .qopt')[ai].classList.add('ok');
      if(!p2.quizWrong.includes(q.q))p2.quizWrong.push(q.q);
    }
    saveDB(DB);
    $$('#quizBox2 .qopt').forEach(x=>x.disabled=true);
    $('#qexp').innerHTML='<b>'+(i===ai?'答对啦！':'再想想～')+'</b> '+q.e;
    $('#quizStat').textContent='星星 '+DB[ME].stars;
    setTimeout(()=>{QI++;quizShow();},i===ai?1700:2600);

    left=LIM[Math.min(step,LIM.length-1)];
    if(GTIMER)clearInterval(GTIMER);
    GTIMER=setInterval(tick,100);paint();
  }
  function draw(){
    const c=mix();
    const pot=$('#pot');if(!pot)return;
    pot.setAttribute('fill',c==='#000000'?'#EDE7F3':c);
    const hit=T.find(x=>x.s.slice().sort().join('')===Object.keys(on).filter(k=>on[k]).sort().join('')&&Object.keys(on).some(k=>on[k]));
    $('#potName').textContent=(c==='#000000')?'关着灯':(hit?hit.n+'！':'混一混…');
    $('#potName').setAttribute('fill',darkTxt(c)?'#3A3355':'#fff');
    const list=Object.keys(on).filter(k=>on[k]).map(k=>NM[k]);
    $('#potMix').textContent=list.length?('锅里加了：'+list.join(' + ')):'点右边的彩色按钮，把光加进锅里';
    const tg=T[Math.min(step,T.length-1)];
    $('#p6tgt').style.background=tg.c;
    $('#p6t').textContent=tg.n;
    $('#p6t').style.color=(tg.c==='#FFFFFF'||tg.c==='#FFD93D')?'#C98A0A':tg.c;
    updBtns();updDots();
    if(step<T.length&&!W){
      const tk=T[step].s.slice().sort().join('');
      const ck=Object.keys(on).filter(k=>on[k]).sort().join('');
      if(ck===tk&&ck){
        step++;
        if(step>=T.length&&!W){W=1;
          if(GTIMER){clearInterval(GTIMER);GTIMER=null;}
          $('#s6msg').textContent='五锅全部调好啦！';
          setTimeout(function(){let st=3-GERR;if(gSec()>200)st--;
            finishLevel(Math.max(1,st),'色光越混越亮：红+绿=黄，绿+蓝=青，红+蓝=品红，三种全开就是白光。');},700);
        }else{
          Object.keys(on).forEach(k=>on[k]=0);
          $('#s6msg').textContent='对啦！进入下一锅';
          begin();draw();
        }
      }
    }
  }
  window.toggleLamp=k=>{if(W)return;on[k]=on[k]?0:1;draw();
    const tk=T[Math.min(step,T.length-1)].s.slice().sort().join('');
    const ck=Object.keys(on).filter(x=>on[x]).sort().join('');
    if(ck!==tk)$('#s6msg').textContent=(ck?'再看看，还差什么光？':'加一束光试试');};
  window.clearPot=()=>{if(W)return;on={R:0,G:0,B:0};$('#s6msg').textContent='清空啦，重新加光';draw();};
  begin();draw();
  HINTFN=()=>{$('#gMsg').textContent='照着大圆点的颜色按按钮：黄色=红光+绿光，青色=绿光+蓝光，白光=三个全开。用提示会少一颗星哦。';};
}

/* 第 7 关：彩虹点灯（记住亮灯顺序再复现，纯点击） */
function lv7(){
  gBegin();
  const POS=[[110,150],[310,150],[510,150],[190,300],[350,300],[510,300],[350,64]];
  const NM=['红','橙','黄','绿','青','蓝','紫'];
  let seq=[],round=0,inputIdx=0,accept=false,showing=false;
  $('#stage').innerHTML=`<svg id="s7" viewBox="0 0 700 420">
   <defs><linearGradient id="g7" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0" stop-color="#2C2A4A"/><stop offset="1" stop-color="#4A3F78"/></linearGradient></defs>
   <rect width="700" height="420" rx="18" fill="url(#g7)"/>
   <circle cx="70" cy="60" r="2.5" fill="#fff" opacity=".8"/><circle cx="640" cy="90" r="2" fill="#fff" opacity=".7"/>
   <circle cx="580" cy="40" r="1.8" fill="#fff" opacity=".6"/><circle cx="120" cy="360" r="2" fill="#fff" opacity=".5"/>
   <circle cx="660" cy="330" r="2.4" fill="#fff" opacity=".7"/><circle cx="40" cy="220" r="1.8" fill="#fff" opacity=".6"/>
   <g id="lamps7"></g>
   <text x="350" y="398" text-anchor="middle" font-size="20" font-weight="700" fill="#FFE9B8" id="l7txt">看彩虹灯怎么亮，然后照着点</text>
  </svg>`;
  $('#ctrl').innerHTML=`<div class="gbar"><span class="gpill" id="p7pg">第 1 / 6 轮</span>
      <span class="gpill warn" id="p7er">失误 0 次</span></div>
    <h3>彩虹点灯</h3>
    <div class="muted">夜晚的彩虹城堡要亮灯啦！彩虹灯会按顺序闪，记住顺序，照着点一遍。</div>
    <button class="btn o sm" id="l7replay" style="margin-top:4px">👀 再看一遍顺序</button>
    <div class="muted" id="s7msg"></div>`;
  $('#lamps7').innerHTML=POS.map((p,i)=>`
    <g class="lamp" data-i="${i}" style="cursor:pointer">
      <circle class="glow" cx="${p[0]}" cy="${p[1]}" r="56" fill="${RAINBOW[i]}" opacity="0"/>
      <circle class="body" cx="${p[0]}" cy="${p[1]}" r="40" fill="${RAINBOW[i]}" opacity=".3" stroke="#fff" stroke-width="3"/>
      <circle cx="${p[0]-12}" cy="${p[1]-12}" r="9" fill="#fff" opacity=".35"/>
    </g>`).join('');
  function flash(i,ms){
    return new Promise(res=>{
      const g=$$('#lamps7 .lamp')[i];
      if(!g){res();return;}
      g.querySelector('.body').style.filter='brightness(2)';
      g.querySelector('.glow').setAttribute('opacity','.5');
      setTimeout(()=>{g.querySelector('.body').style.filter='';
        g.querySelector('.glow').setAttribute('opacity','0');
        setTimeout(res,160);},ms);
    });
  }
  async function playSeq(){
    showing=true;accept=false;inputIdx=0;
    $('#l7txt').textContent='彩虹灯亮起来啦，仔细看……';
    for(const s of seq){await flash(s,430);}
    $('#l7txt').textContent='到你了，按顺序点亮它们！';
    showing=false;accept=true;
  }
  $('#l7replay').onclick=()=>{if(!showing&&!GDONE)playSeq();};
  function nextRound(){
    round++;
    if(round>6){
      let st=3-GERR;if(gSec()>150)st--;
      finishLevel(Math.max(1,st),'红绿灯、灯塔、信号灯，都是用光的颜色和闪动来传递消息——光的颜色会说话。');
      return;
    }
    $('#p7pg').textContent='第 '+round+' / 6 轮';
    seq.push(Math.floor(Math.random()*7));
    playSeq();
  }
  $$('#lamps7 .lamp').forEach(g=>{
    g.addEventListener('click',async()=>{
      if(!accept)return;
      const i=+g.dataset.i;
      accept=false;
      await flash(i,240);
      if(seq[inputIdx]===i){
        inputIdx++;
        if(inputIdx>=seq.length){
          $('#s7msg').textContent='点对啦！准备下一轮';
          setTimeout(nextRound,900);
        }else accept=true;
      }else{
        GERR++;$('#p7er').textContent='失误 '+GERR+' 次';
        $('#s7msg').textContent='点错啦，再看一遍顺序';
        setTimeout(playSeq,900);
      }
    });
  });
  HINTFN=()=>{$('#gMsg').textContent='记颜色出现的先后顺序：第 1 个、第 2 个……别慌，慢慢点。用提示会少一颗星哦。';};
  nextRound();
}
